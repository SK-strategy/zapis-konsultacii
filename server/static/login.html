<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/static/favicon.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><meta name="theme-color" content="#123b33">
<title>Вход в кабинет — Губенко Групп</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>.box{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}h1{font-size:22px}</style>
</head><body>
<form class="box" id="f" novalidate>
  <div style="display:flex;gap:10px;align-items:center"><span id="logo" style="width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 14px/1 var(--f-display);overflow:hidden">ГГ</span><b style="font:600 16px/1.2 var(--f-display)">Губенко Групп</b></div>
  <h1>Вход в кабинет</h1>
  <p class="sub" style="margin:0">Кабинет админа и менеджеров: расписание, заявки, клиенты. Логин и пароль выдаёт админ.</p>
  <div class="field"><label for="l">Логин</label><input id="l" autocomplete="username" autocapitalize="none" required></div>
  <div class="field"><label for="p">Пароль</label><input id="p" type="password" autocomplete="current-password" required></div>
  <p class="err" id="e" hidden></p>
  <button class="btn" id="go" type="submit">Войти</button>
</form>
<script>
fetch('/api/funnel').then(r=>r.json()).then(F=>{const l=document.getElementById('logo');if(F.logo){l.innerHTML='';const i=document.createElement('img');i.src=F.logo;i.alt='';i.style.cssText='width:100%;height:100%;object-fit:cover';l.append(i);}}).catch(()=>{});
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const e=document.getElementById('e'),go=document.getElementById('go');e.hidden=true;go.disabled=true;
  try{const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('l').value,password:document.getElementById('p').value})});
    const j=await r.json().catch(()=>({}));if(r.ok){location.href='/admin';return;}e.textContent=j.error||'Не получилось войти.';e.hidden=false;}
  catch(x){e.textContent='Нет связи с сервером.';e.hidden=false;}finally{go.disabled=false;}
});
</script></body></html>
