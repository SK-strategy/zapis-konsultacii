<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="/static/favicon.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><meta name="theme-color" content="#123b33">
<title>Запись на консультацию — Gubenko Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
.flow{max-width:560px;margin:0 auto;padding-block:16px 0;display:grid;gap:16px}
.brandbar{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 15px/1 var(--f-display);flex:0 0 auto;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brandbar b{display:block;font:600 16px/1.2 var(--f-display)}.brandbar small{color:var(--muted);font-size:13px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.card h1{font-size:clamp(20px,5.4vw,24px);margin:0}
.card h2{font:600 18px/1.3 var(--f-display);margin:0}
.card p{margin:0;white-space:pre-line}
.step-n{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.q{font-weight:600;font-size:18px;margin:0}
.hint{color:var(--muted);font-size:14px;margin:0}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;font-weight:500;font-size:16px;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.box{width:20px;height:20px;border:2px solid var(--line);border-radius:6px;flex:0 0 auto;display:grid;place-items:center;font-size:13px;color:var(--accent-fg)}
.opt[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.back{border:0;background:none;color:var(--muted);padding:4px 0;font-size:14px;justify-self:start}
.big{width:100%;padding:15px 20px;font-size:16px}
.offer{background:var(--accent-soft);border-color:transparent}
.how{font-size:14px;color:var(--muted)}
.tzrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.tzrow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:14px;max-width:100%}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;text-align:left;min-width:84px}
.day b{display:block;font-weight:600}.day small{color:var(--muted);font-size:12px}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.day:disabled{opacity:.45;cursor:default}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.time{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;display:grid;gap:2px}
.time b{font-size:17px;font-weight:600}.time small{color:var(--muted);font-size:12px}
.time:disabled{background:var(--sunk);color:var(--muted);cursor:default;text-decoration:line-through}
.label{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.form{display:grid;gap:12px}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipset button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500}
.chipset button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}.check input{margin-top:3px;width:18px;height:18px;flex:0 0 auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere;font-weight:500}
.status{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--warn-soft);color:var(--warn);width:max-content}
.status.ok{background:var(--ok-soft);color:var(--ok)}.status.off{background:var(--sunk);color:var(--muted)}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px}
.loading{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.screen{animation:rise .2s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.4}}}
</style>
</head>
<body>
<main class="flow">
  <div class="brandbar"><span class="logo" id="logo">GG</span><div><b id="brand">Gubenko Group</b><small id="brandsub">юридическая помощь с долгами</small></div></div>
  <p class="loading" id="loading">Загружаю…</p>
  <div id="screen"></div>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const el=(t,a={},k=[])=>{const n=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')n.className=v;else if(x==='text')n.textContent=v;else if(x.startsWith('on'))n.addEventListener(x.slice(2),v);else if(v===false||v==null){}else n.setAttribute(x,v===true?'':v);}
    [].concat(k).forEach(c=>c!=null&&n.append(c));return n;};
  const api=async(path,body)=>{const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Не получилось. Попробуйте ещё раз.');e.status=r.status;throw e;}return j;};
  const tz='Europe/Moscow';
  const fmt=(iso,o)=>new Intl.DateTimeFormat('ru-RU',{timeZone:tz,...o}).format(new Date(iso));
  const timeL=iso=>fmt(iso,{hour:'2-digit',minute:'2-digit'});
  const dayL=iso=>fmt(iso,{weekday:'long',day:'numeric',month:'long'});
  const dayShort=iso=>fmt(iso,{weekday:'short',day:'numeric',month:'short'});
  const show=(...kids)=>{$('screen').replaceChildren(el('div',{class:'screen flow',style:'padding:0'},kids));window.scrollTo(0,0);};
  let F=null,days=[],day=null,pick=null,form={name:'',phone:''};

  function phoneNational(v){v=String(v||'').trim();let d=v.replace(/\D/g,'');if(/^\+\s*7/.test(v))d=d.slice(1);if(d&&'78'.includes(d[0]))d=d.slice(1);return d.slice(0,10);}
  function phoneMask(v,del){const d=phoneNational(v);if(!d)return !del&&/\d|\+/.test(v)?'+7 (':'';let s='+7 ('+d.slice(0,3);if(d.length>3)s+=') '+d.slice(3,6);if(d.length>6)s+='-'+d.slice(6,8);if(d.length>8)s+='-'+d.slice(8,10);return s;}
  const phoneValid=v=>{const d=phoneNational(v);return d.length===10&&d[0]==='9'&&new Set(d).size>2;};

  const freeN=d=>d.slots.filter(s=>s.free).length;
  async function slots(){
    try{days=(await api('/api/slots')).days;}catch(e){show(el('p',{class:'err',text:'Не получилось загрузить время. Обновите страницу.'}));return;}
    renderSlots();
  }
  function renderSlots(){
    if(!day||!days.find(d=>d.date===day)||!freeN(days.find(d=>d.date===day)))day=(days.find(d=>freeN(d))||days[0]||{}).date;
    const cur=days.find(d=>d.date===day),any=days.some(freeN);
    show(el('div',{class:'card'},[el('h1',{text:'Запись на консультацию'}),el('p',{text:'Выберите удобные дату и время, оставьте имя и телефон — мы подтвердим запись.'}),el('p',{class:'hint',text:'Время указано по Москве · '+F.duration})]),
      any?el('p',{class:'label',text:'День'}):el('p',{class:'note',text:'Свободного времени на ближайшие дни нет. Попробуйте зайти позже.'}),
      any?el('div',{class:'days'},days.map(d=>{const n=freeN(d);return el('button',{type:'button',class:'day','aria-pressed':String(d.date===day),disabled:!n,onclick:()=>{day=d.date;renderSlots();}},[el('b',{text:dayShort(d.slots[0].start)}),el('small',{text:n?'свободно: '+n:'нет мест'})]);})):null,
      any?el('p',{class:'label',text:'Время'}):null,
      any?el('div',{class:'times'},(cur?cur.slots:[]).map(s=>el('button',{type:'button',class:'time',disabled:!s.free,onclick:()=>{pick={date:day,hour:s.hour,start:s.start};contact();}},[el('b',{class:'tnum',text:timeL(s.start)}),el('small',{text:s.free?'свободно':'занято'})]))):null);
  }
  function contact(){
    const name=el('input',{id:'n',autocomplete:'name',value:form.name}),phone=el('input',{id:'p',type:'tel',inputmode:'tel',autocomplete:'tel',placeholder:'+7 (912) 345-67-89',value:form.phone});
    phone.addEventListener('input',e=>{phone.value=phoneMask(phone.value,/^delete/.test(e.inputType||''));});
    phone.addEventListener('focus',()=>{if(!phone.value)phone.value='+7 (';});
    phone.addEventListener('blur',()=>{if(!phoneNational(phone.value))phone.value='';});
    const consent=el('input',{type:'checkbox',id:'c'}),web=el('input',{tabindex:'-1',autocomplete:'off'});
    const err=el('p',{class:'err',hidden:true}),go=el('button',{class:'btn big',type:'submit',text:'Записаться'});
    const f=el('form',{class:'form',novalidate:true},[
      el('div',{class:'field'},[el('label',{for:'n',text:'Как к вам обращаться?'}),name]),
      el('div',{class:'field'},[el('label',{for:'p',text:'Телефон'}),phone]),
      el('div',{class:'hp','aria-hidden':'true'},[web]),
      el('label',{class:'check'},[consent,el('span',{},[(F.consent_text||'Согласен на обработку персональных данных')+' ',el('a',{href:F.privacy_url,target:'_blank',rel:'noopener',text:'Документ'})])]),err,go]);
    f.addEventListener('submit',async e=>{e.preventDefault();err.hidden=true;form={name:name.value.trim(),phone:phone.value.trim()};
      const bad=!form.name?'Укажите, как к вам обращаться.':!phoneValid(form.phone)?'Проверьте номер телефона: нужен российский мобильный.':!consent.checked?'Отметьте согласие на обработку персональных данных.':'';
      if(bad){err.textContent=bad;err.hidden=false;return;}
      go.disabled=true;
      try{const j=await api('/api/book',{name:form.name,phone:form.phone,consent:true,website:web.value,date:pick.date,hour:pick.hour,tz});done(j);}
      catch(ex){err.textContent=ex.message||'Нет связи с сервером.';err.hidden=false;if(ex.status===409)setTimeout(slots,1600);}finally{go.disabled=false;}});
    show(el('div',{class:'card'},[el('div',{class:'step-n',text:'Ваша консультация'}),el('p',{class:'q',text:dayL(pick.start)+', '+timeL(pick.start)}),el('p',{class:'hint',text:'по Москве · '+F.duration}),f]),
      el('button',{class:'back',type:'button',text:'← Выбрать другое время',onclick:renderSlots}));
    setTimeout(()=>name.focus(),0);
  }
  function done(j){
    show(el('div',{class:'card'},[el('span',{class:'status ok',text:'Вы записаны'}),el('h2',{text:dayL(j.start)+', '+timeL(j.start)}),el('p',{text:'Время по Москве. Мы свяжемся с вами по телефону, чтобы подтвердить консультацию.'}),
      el('a',{class:'btn ghost',href:j.ics,text:'Добавить в календарь'})]));
  }
  api('/api/funnel').then(f=>{F=f;$('brand').textContent=f.brand;$('brandsub').textContent=f.brand_sub||'';
    if(f.logo){const l=$('logo');l.textContent='';l.append(el('img',{src:f.logo,alt:''}));}
    $('loading').remove();slots();}).catch(()=>{$('loading').textContent='Не получилось загрузить страницу. Обновите её.';});
})();
</script>
</body>
</html>
