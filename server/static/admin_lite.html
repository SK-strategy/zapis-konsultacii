<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/static/favicon.png"><meta name="theme-color" content="#123b33">
<title>Записи — Gubenko Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
main{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font:600 18px/1.2 var(--f-display)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row.past{opacity:.6}.row.off{opacity:.5;text-decoration:line-through}
.when{font-weight:600}.who{color:var(--muted);font-size:14px}
h2{font:600 15px/1.3 var(--f-display);margin:8px 0 0;color:var(--muted)}
</style></head><body>
<main>
  <div class="top"><b id="title">Записи на консультации</b><button class="btn ghost" id="out" type="button">Выйти</button></div>
  <p class="note">Простая версия: список записей клиентов. Одно расписание, без анкеты, кабинетов менеджеров и аналитики.</p>
  <div id="list"><p class="note">Загружаю…</p></div>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=(d,h)=>new Intl.DateTimeFormat('ru-RU',{weekday:'short',day:'numeric',month:'long',timeZone:'Europe/Moscow'}).format(new Date(d+'T12:00:00+03:00'))+', '+String(h).padStart(2,'0')+':00';
async function api(p,o){const r=await fetch(p,o);if(r.status===401){location.href='/admin/login';throw 0;}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Ошибка');return j;}
function row(x,past){
  const d=document.createElement('div');d.className='row'+(past?' past':'')+(x.status==='cancelled'?' off':'');
  const l=document.createElement('div');
  l.innerHTML='<div class="when"></div><div class="who"></div>';
  l.firstChild.textContent=fmt(x.date,x.hour);l.lastChild.textContent=x.name+' · '+x.phone;d.append(l);
  if(x.status==='booked'&&!past){const b=document.createElement('button');b.className='btn ghost';b.textContent='Отменить';
    b.onclick=async()=>{if(!confirm('Отменить запись: '+x.name+'?'))return;try{await api('/api/lite/bookings/'+x.id+'/cancel',{method:'POST',headers:{'X-Requested-With':'fetch'}});load();}catch(e){alert(e.message);}};d.append(b);}
  else if(x.status==='cancelled'){const s=document.createElement('span');s.className='note';s.textContent='отменена';d.append(s);}
  return d;
}
async function load(){
  const j=await api('/api/lite/bookings');$('title').textContent=j.brand+' — записи';
  const nowMs=Date.parse(j.now),isPast=x=>Date.parse(x.date+'T'+String(x.hour).padStart(2,'0')+':00:00+03:00')<nowMs;
  const up=j.bookings.filter(x=>!isPast(x)&&x.status==='booked'),past=j.bookings.filter(x=>isPast(x)||x.status!=='booked').reverse();
  const box=document.createElement('div');box.style.cssText='display:grid;gap:8px';
  const h=t=>{const e=document.createElement('h2');e.textContent=t;return e;};
  box.append(h('Предстоящие ('+up.length+')'));
  if(!up.length){const p=document.createElement('p');p.className='note';p.textContent='Пока записей нет.';box.append(p);}
  up.forEach(x=>box.append(row(x,false)));
  if(past.length){box.append(h('Прошедшие и отменённые'));past.forEach(x=>box.append(row(x,true)));}
  $('list').replaceChildren(box);
}
$('out').onclick=async()=>{try{await fetch('/admin/logout',{method:'POST'});}catch(e){}location.href='/admin/login';};
load();
</script></body></html>
